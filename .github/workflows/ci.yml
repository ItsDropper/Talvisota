name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talvisota-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
          -DBUILD_TESTING=ON
          -DTALVISOTA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Application smoke test
        run: .\build\talvisota.exe --help

      - name: Content validator help smoke test
        run: .\build\talvisota_content_validate.exe --help

      - name: Validate shipped content
        run: .\build\talvisota_content_validate.exe content/catalog.tmanifest .

  windows-msvc-renderer-adapter:
    name: Windows x64 / MSVC renderer adapter
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure pinned VantaEngine adapter
        run: >-
          cmake -S . -B build-msvc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DTALVISOTA_WARNINGS_AS_ERRORS=ON
          -DTALVISOTA_ENABLE_VANTA_ENGINE=ON

      - name: Build renderer adapter and content asset tools
        run: cmake --build build-msvc --target talvisota_renderer_sample talvisota_renderer_contract_tests talvisota_asset_validate talvisota_content_package talvisota_texture_process talvisota_engine_asset_validation_tests talvisota_engine_asset_package_tests talvisota_engine_asset_pipeline_tests --parallel

      - name: Test game-owned renderer and asset contracts
        run: ctest --test-dir build-msvc --output-on-failure -R "Talvisota.Presentation.SceneRendererContract|Talvisota.Content.EngineAssetValidation|Talvisota.Content.EngineAssetPackage|Talvisota.Content.EngineAssetPipeline|Talvisota.Environment.PbrMaps"

      - name: Engine-backed content asset validation smoke test
        run: .\build-msvc\talvisota_asset_validate.exe content/catalog.tmanifest .

      - name: Build deterministic content package
        run: .\build-msvc\talvisota_content_package.exe content/catalog.tmanifest . "$env:RUNNER_TEMP\talvisota-content-package"

      - name: Verify packaged content integrity
        run: .\build-msvc\talvisota_content_package.exe --verify "$env:RUNNER_TEMP\talvisota-content-package"

      - name: Texture processor help smoke test
        run: .\build-msvc\talvisota_texture_process.exe --help

      - name: Render Sakkola terrain viewpoints
        timeout-minutes: 20
        shell: pwsh
        run: |
          $captureDir = Join-Path $env:RUNNER_TEMP 'sakkola-captures'
          New-Item -ItemType Directory -Force -Path $captureDir | Out-Null
          $process = Start-Process -FilePath .\build-msvc\talvisota_renderer_sample.exe -ArgumentList @('--backend=d3d12', "--capture-dir=$captureDir", '--frames-per-view=5') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sakkola renderer exited with code $($process.ExitCode)" }
          $captures = @(Get-ChildItem -LiteralPath $captureDir -Filter '*.png' -File)
          if ($captures.Count -ne 5) { throw "Expected five rendered PNGs, found $($captures.Count)" }
          $captures | Format-Table Name, Length

      - name: Upload Sakkola terrain screenshots
        uses: actions/upload-artifact@v4
        with:
          name: talvisota-sakkola-terrain-screenshots
          path: ${{ runner.temp }}/sakkola-captures/*.png
          if-no-files-found: error
          retention-days: 30
